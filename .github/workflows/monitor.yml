name: Shopify Drop Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests certifi

      - name: Run script & update cache
        run: |
          python shopify_monitor.py

      - name: Sync product_cache.json to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          include: 'product_cache.json'
          server-dir: /public_html/tay/

      - name: Commit and push cache if updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add product_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update product cache [skip ci]" && git push)
